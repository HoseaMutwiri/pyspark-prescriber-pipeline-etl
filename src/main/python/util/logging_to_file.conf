
[loggers]
keys = root,create_objects,validations,run_data_ingestion,run_presc_data_preprocessing,presc_run_data_transform,presc_run_data_extract,presc_run_data_persist


[handlers]
keys = fileHandler

[formatters]

keys = fileFormatter

[logger_root]

level = DEBUG
handlers = fileHandler

[logger_create_objects]
level = DEBUG
handlers = fileHandler
qualname = create_objects
propagate = 0

[logger_validations]
level = DEBUG
handlers = fileHandler
qualname = validations
propagate = 0

[logger_run_data_ingestion]
level = DEBUG
handlers = fileHandler
qualname = run_data_ingestion
propagate = 0

[logger_run_presc_data_preprocessing]
level = DEBUG
handlers = fileHandler
qualname = run_presc_data_preprocessing
propagate = 0


[logger_presc_run_data_transform]
level = DEBUG
handlers = fileHandler
qualname = presc_run_data_transform
propagate = 0

[logger_presc_run_data_extract]
level = DEBUG
handlers = fileHandler
qualname = presc_run_data_extract
propagate = 0

[logger_presc_run_data_persist]
level = DEBUG
handlers = fileHandler
qualname = presc_run_data_persist
propagate = 0


[handler_fileHandler]
class = FileHandler
level = DEBUG
formatter = fileFormatter
args = ('../logs/presc_run_pipeline.log','a')

[formatter_fileFormatter]
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt = %d-%b-%y %H:%M:%S
